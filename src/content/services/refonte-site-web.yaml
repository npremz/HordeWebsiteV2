translations:
  en:
    seoUrl: /en/services/website-redesign-brussels/
    seoPrimaryKeyword: website redesign brussels
    seoSecondaryKeywords:
      - ux ui redesign
      - website modernization
      - improve website conversion
      - website redesign belgium
      - website redesign cost
    seoTitle: 'Website redesign in Brussels: UX, SEO and speed'
    seoDescription: >-
      Horde redesigns websites to improve clarity, speed, technical SEO and
      conversion, with a solid information architecture and measurable priorities.
    seoInternalLinks:
      - /en/services/technical-seo-audit-brussels/
      - /en/services/optimisation-site-web/
      - /en/projets/

notes:
  - >-
    Le lecteur a déjà un site mais il ne lui convient plus. Il cherche à
    comprendre ce que ça implique (coût, délai, risque SEO) avant de décider.
  - >-
    Traiter les objections en priorité : coût, durée, impact SEO, gestion du
    contenu après livraison.
  - >-
    Ne pas promettre de résultats SEO en semaines : c'est le moyen le plus
    rapide de perdre de la crédibilité.
  - >-
    Ton : sérieux, structuré, sans sur-vente. On est une agence qui fait du bon
    travail, pas "la meilleure agence de Bruxelles".

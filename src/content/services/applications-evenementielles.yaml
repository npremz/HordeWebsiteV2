notes:
  - >-
    Cibles : organisateurs d’événements, agences de communication, équipes
    marketing, animateurs de workshops et équipes produit.
  - >-
    Mettre en avant la participation et la coordination des interfaces public,
    animateur et affichage, avec une date et un déroulé définis.
  - >-
    Les workshops à 42 et la présentation interactive décrits dans l’article
    constituent les exemples existants. Ne pas inventer de résultats chiffrés.
  - >-
    Le délai de deux semaines reste un retour d’expérience sur un périmètre
    cadré. L’assistance sur place et le fonctionnement hors ligne sont à définir.

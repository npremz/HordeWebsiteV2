        url: /en/contact/
intro: >-
  Salons, workshops, présentations produit : on crée les applications qui font
  participer votre public. Interfaces interactives, outils d’animation et
  affichage synchronisé, pensés pour votre événement et les personnes qui le font vivre.
problemTitle: Un événement, plusieurs interfaces à coordonner
problemBlocks:
  - kind: paragraph
    body: >-
      Les participants suivent une session sur leur téléphone, l’animateur donne
      le rythme et un écran affiche les résultats. L’application relie ces rôles
      autour du même déroulé, avec une action claire pour chaque personne.
    items: []
offerTitle: Trois façons de faire vivre votre événement
offerItems:
  - title: Salons et stands
    body: >-
      Faites explorer un catalogue sur tablette, essayer une démonstration
      produit ou participer à un quiz. On conçoit des interactions courtes,
      adaptées au rythme d’un stand, avec un accès par lien ou QR code et une
      collecte de contacts quand elle sert votre objectif.
  - title: Workshops et ateliers
    body: >-
      Organisez les équipes, lancez des défis, recueillez des votes et affichez
      la progression en direct. L’animateur pilote les étapes depuis une
      interface centrale ; les participants et les écrans de la salle reçoivent
      les informations au bon moment.
  - title: Présentations et lancements
    body: >-
      Donnez à votre public un moyen d’explorer votre produit : démonstration
      interactive, simulateur, parcours guidé ou questions pendant la
      présentation. Les contenus et les interactions suivent votre message,
      avec un pilotage par le présentateur quand il faut garder le rythme.
methodTitle: Du déroulé à la mise en service
methodSteps:
  - title: Cadrage de l’événement
    body: >-
      On passe en revue la date, le public, le déroulé, le lieu et les appareils
      disponibles. Ensemble, on définit les interactions utiles, les rôles et
      le périmètre à livrer avant l’événement.
  - title: Prototype
    body: >-
      On construit un premier parcours utilisable pour éprouver l’idée. Vous
      pouvez tester l’expérience participant, les commandes d’animation et
      l’écran de présentation avant de valider la conception.
  - title: Développement
    body: >-
      On réalise les interfaces prévues, les connexions aux données et la
      synchronisation nécessaire. Vous avez accès à une version de test tout
      au long du travail pour ajuster l’expérience ensemble.
  - title: Répétition
    body: >-
      On déroule l’événement sur les appareils prévus. On vérifie les usages
      simultanés, l’affichage et la reprise après une coupure de connexion,
      puis on prépare le scénario de secours convenu avec votre équipe.
  - title: Mise en service
    body: >-
      On déploie l’application et on forme votre équipe au pilotage. La durée
      d’hébergement, l’assistance pendant l’événement et la réutilisation sont
      définies avant le lancement pour que chacun sache qui fait quoi.
deliverablesTitle: Les outils pour le jour J
deliverables:
  - Application déployée et interfaces participants prévues
  - Interface de pilotage adaptée à votre déroulé
  - Affichage synchronisé sur les écrans prévus
  - Parcours testé et support de répétition
  - Guide d’utilisation et prise en main avec votre équipe
  - Code source et accès à l’hébergement
exclusionsTitle: Un dispositif préparé pour le jour J
exclusionsParagraphs:
  - >-
    On définit le périmètre autour de votre date, de votre public et du matériel
    disponible. Le nombre de participants prévu, les conditions de connexion
    et les écrans font partie du cadrage et de la répétition.
  - >-
    On précise ensemble la durée d’hébergement, qui pilote l’application et
    l’assistance nécessaire pendant l’événement. La présence sur place, la
    fourniture de matériel et les éditions suivantes font l’objet d’un
    périmètre distinct selon vos besoins.
faqTitle: Avant votre événement
faqItems:
  - question: Combien coûte une application événementielle ?
    answer: >-
      Le budget dépend du nombre d’interfaces, des interactions, des systèmes à
      connecter et de l’accompagnement prévu. On chiffre un périmètre convenu
      après avoir étudié votre événement. Une démonstration sur tablette et un
      workshop par équipes avec des écrans synchronisés demandent des volumes
      de travail différents.
  - question: Combien de temps faut-il prévoir ?
    answer: >-
      Certains de nos projets bien cadrés ont atteint une première version
      utilisable en environ deux semaines. C’est un retour d’expérience, pas
      une promesse de délai fixe. Partagez votre date assez tôt pour prévoir le
      prototype, le développement et une répétition avant l’événement.
  - question: Les participants doivent-ils installer une application ?
    answer: >-
      L’expérience s’ouvre dans un navigateur, depuis un lien ou un QR code.
      On l’adapte aux téléphones, tablettes, ordinateurs et écrans de
      présentation retenus pour l’événement. Les navigateurs concernés sont
      testés pendant la préparation.
  - question: Que se passe-t-il si la connexion du lieu est instable ?
    answer: >-
      On examine le réseau disponible dès le cadrage. Selon le parcours, on
      peut prévoir des contenus accessibles localement, une reprise après
      coupure ou un mode de secours simplifié. Les votes, scores et écrans
      partagés nécessitent une connexion adaptée ; les usages hors ligne
      doivent être prévus et testés.
  - question: Pouvez-vous assurer une assistance le jour J ?
    answer: >-
      On peut prévoir un accompagnement selon votre date et nos disponibilités.
      Les horaires, les modalités à distance ou sur place et le contact
      technique sont définis dans le devis. Votre équipe bénéficie d’une prise
      en main avant l’événement.
  - question: Peut-on réutiliser l’application pour un autre événement ?
    answer: >-
      Oui. On peut prévoir dès le départ la mise à jour des contenus et la
      remise à zéro des sessions. Vous recevez le code source et les accès à
      l’environnement. L’hébergement après l’événement, les éditions suivantes
      et les nouvelles fonctions sont définis selon vos besoins.
ctaTitle: Parlons de votre événement
ctaParagraphs:
  - >-
    Partagez votre date, le format, le public attendu et ce que vous souhaitez
    lui faire faire. Si vous avez déjà un déroulé ou une liste d’appareils,
    ajoutez-les pour qu’on puisse définir ensemble un périmètre utile.
  - >-
    Ou écrivez-nous à l’adresse hello@hordeagence.com

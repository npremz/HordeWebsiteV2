    h1: Event web app<br>development
    shortName: Event web apps
    footerTitle: Event web apps
    intro: >-
      Trade shows, workshops, product presentations: we build apps that let your
      audience take part. Interactive interfaces, host controls and synchronised
      displays, designed around your event and the people running it.
    problemTitle: One event, several interfaces to coordinate
    problemBlocks:
      - kind: paragraph
        body: >-
          Participants follow a session on their phones, the host sets the pace
          and a screen shows the results. The application connects these roles
          around the same event schedule, with a clear action for each person.
        items: []
    offerTitle: Three ways to bring your event to life
    offerItems:
      - title: Trade shows and stands
        body: >-
          Let visitors explore a catalogue on a tablet, try a product demo or
          take part in a quiz. We design short interactions for the pace of a
          stand, with access by link or QR code and contact collection when it
          serves your goal.
      - title: Workshops and team sessions
        body: >-
          Organise teams, launch challenges, collect votes and show progress in
          real time. The host controls each stage from one interface, while
          participants and the room display receive the information they need.
      - title: Presentations and launches
        body: >-
          Give your audience a way to explore your product: an interactive demo,
          a simulator, a guided journey or questions during the presentation.
          The content and interactions follow your message, with host controls
          when you need to set the pace.
    methodTitle: From the event schedule to the live session
    methodSteps:
      - title: Event scoping
        body: >-
          We review the date, audience, schedule, venue and available devices.
          Together, we define the useful interactions, the roles and the scope
          to deliver before the event.
      - title: Prototype
        body: >-
          We build a first usable journey to test the idea. You can try the
          participant experience, the host controls and the presentation screen
          before approving the design.
      - title: Development
        body: >-
          We build the agreed interfaces, connect the data and configure any
          synchronisation. You have access to a test version throughout the
          work so we can adjust the experience together.
      - title: Rehearsal
        body: >-
          We run through the event on the planned devices. We check simultaneous
          use, display behaviour and connection recovery, then prepare the
          fallback agreed with your team.
      - title: Launch and handover
        body: >-
          We deploy the application and help your team learn the controls.
          Hosting duration, event support and any reuse are agreed before
          launch so everyone knows who handles what.
    deliverablesTitle: The tools for your event
    deliverables:
      - Deployed application and agreed participant interfaces
      - Host controls adapted to your event schedule
      - Synchronised display for the planned screens
      - Tested event journey and rehearsal checklist
      - User guide and a handover session for your team
      - Source code and access to the hosting environment
    exclusionsTitle: A setup prepared for the live session
    exclusionsParagraphs:
      - >-
        We define the scope around your event date, your audience and the
        equipment available. The planned number of participants, network
        conditions and display setup are part of the brief and the rehearsal.
      - >-
        We agree on hosting duration, who operates the application and the
        support required during the event. On-site assistance, equipment
        provision and later editions are scoped separately when needed.
    faqTitle: Before your event
    faqItems:
      - question: How much does an event web app cost?
        answer: >-
          The budget depends on the number of interfaces, the interactions, the
          systems to connect and the support required. We quote an agreed scope
          after reviewing your event. A tablet demo and a team workshop with
          synchronised screens involve different amounts of work.
      - question: How far ahead should we start?
        answer: >-
          Some of our tightly scoped projects have reached a first usable
          version in about two weeks. That is a reference from past work, not a
          fixed delivery promise. Share your date early so we can plan the
          prototype, development and a rehearsal before the event.
      - question: Do participants have to install an app?
        answer: >-
          The experience opens in a browser through a link or QR code. We adapt
          it to the phones, tablets, computers and presentation screens chosen
          for the event, and test the relevant browsers during preparation.
      - question: What happens if the venue connection is unreliable?
        answer: >-
          We review the venue network during scoping. Depending on the journey,
          we can plan locally available content, reconnection handling or a
          simplified fallback. Shared votes, scores and screens need a suitable
          connection; any offline behaviour must be planned and tested.
      - question: Can you provide support during the event?
        answer: >-
          We can plan support according to your date and our availability. The
          hours, remote or on-site arrangements and technical contact are
          defined in the quote. Your team receives a handover before the event.
      - question: Can we reuse the application for another event?
        answer: >-
          Yes. We can plan for content updates and session resets from the
          start. You receive the source code and access to the environment.
          Hosting after the event, new editions and additional features are
          agreed according to your needs.
    ctaTitle: Tell us about your event
    ctaParagraphs:
      - >-
        Share your date, format, expected audience and what you want people to
        do. If you already have a schedule or a list of devices, include it so
        we can define a useful scope together.
      - >-
        You can also email us at hello@hordeagence.com
    primaryCtaLabel: Let’s discuss your event
    primaryCtaUrl: /en/contact/
    secondaryCtaLabel: Read about our workshops and interactive presentations

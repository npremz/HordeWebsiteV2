notes:
  - >-
    Ton : technique mais accessible. Le lecteur cible est un décideur (DG,
    directeur marketing), pas un développeur.
  - >-
    Éviter les formulations génériques : "solution sur mesure", "accompagnement
    personnalisé", "experts passionnés".
  - >-
    L'argument central : l'optimisation sans refonte complète — c'est le point
    de différenciation par rapport à une agence qui vend systématiquement des
    refontes.
  - Les résultats sont formulés à partir de mesures avant/après, jamais garantis à l'avance.
order: 5

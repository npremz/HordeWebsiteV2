    seoTitle: Website performance optimization in Brussels
    seoDescription: >-
      Improve website speed, Core Web Vitals and technical SEO with a prioritized
      action plan that fixes bottlenecks without a complete redesign.
    seoInternalLinks:
      - /en/services/technical-seo-audit-brussels/

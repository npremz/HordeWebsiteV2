title_fr: "Deux semaines pour créer une webapp événementielle : ce que l’IA change vraiment"
title_en: "Two Weeks to Build an Event Web App: What AI Really Changes"
seoTitle_fr: "Webapp événementielle : produire un MVP avec l’IA"
seoTitle_en: "Event Web Apps: Building an MVP with AI"
excerpt_fr: >-
  L’IA n’a pas besoin d’être visible dans le produit. Elle rend possible la
  création rapide de webapps sur mesure pour un événement ou un workshop.
excerpt_en: >-
  AI does not have to be visible in the product. It makes the rapid creation of
  bespoke web apps for an event or participatory workshop possible.
seoDescription_fr: >-
  Deux projets concrets montrent comment l’IA accélère la production de webapps
  sur mesure pour des événements, des workshops et des présentations.
seoDescription_en: >-
  Two real projects show how AI speeds up the production of bespoke web apps
  for events, participatory workshops and investor presentations.

keyTakeaways_fr:
  - L’IA transforme surtout la production du logiciel. Elle ne doit pas nécessairement apparaître dans l’expérience proposée au public.
  - Pour deux workshops à 42, une webapp a permis de gérer les équipes, de piloter les supports et de synchroniser les données avec l’affichage.
  - Une autre plateforme a transformé la présentation d’une startup en expérience interactive pour ses investisseurs.
  - Un premier produit de qualité peut être réalisé en environ deux semaines lorsque le besoin, les parcours et les intégrations sont bien cadrés.
keyTakeaways_en:
  - AI primarily changes how software is produced. It does not necessarily have to appear in the experience presented to the audience.
  - For two workshops at 42, a web app managed teams, controlled supporting interfaces and synchronised data with the event display.
  - Another platform turned a startup presentation into an interactive experience for investors.
  - A quality first product can be built in about two weeks when the need, journeys and integrations are tightly scoped.

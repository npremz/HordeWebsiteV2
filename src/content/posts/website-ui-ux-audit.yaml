slug: website-ui-ux-audit
slug_fr: audit-ux-ui-site-web
title_fr: Auditer une interface, c’est regarder ce qu’elle fait faire, pas seulement ce qu’elle montre
title_en: Auditing an interface means looking at what it gets people to do, not just what it shows
seoTitle_fr: 'Audit UX/UI d’un site web : méthode et grille de priorité'
seoTitle_en: 'Website UI/UX audit: a method and a priority grid'
excerpt_fr: >-
  Un audit UX/UI utile ne livre pas quatre-vingts remarques, mais une liste
  courte et ordonnée. La méthode, appliquée à notre propre site, défauts compris.
excerpt_en: >-
  A useful UI/UX audit does not deliver eighty findings but a short, ordered
  list. The method, applied to our own website, flaws included.
seoDescription_fr: >-
  Audit UX/UI d’un site web en quatre étapes : tâches clés, parcours réels,
  frictions prouvées, puis grille gravité × fréquence. Appliqué à hordeagence.com.
seoDescription_en: >-
  A four-step website UI/UX audit: key tasks, real journeys, evidenced friction
  points and a severity × frequency grid. Applied to hordeagence.com.

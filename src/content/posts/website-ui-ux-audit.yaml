keyTakeaways_fr:
  - Un audit UX/UI part des tâches que les gens viennent accomplir, pas des pages, et se fait sur les vrais supports, y compris au clavier.
  - Chaque friction est notée avec sa preuve, puis classée par gravité × fréquence ; ce qui exclut une partie du public passe devant.
  - Sur notre propre site, la méthode a réduit l’audit à sept points ordonnés, dont un défaut de focus qu’aucun outil automatique n’avait relevé.
keyTakeaways_en:
  - A UI/UX audit starts from the tasks people come to complete, not from pages, and is carried out on real devices, keyboard included.
  - Each friction point is recorded with evidence, then ranked by severity × frequency; anything that locks people out goes first.
  - On our own site, the method narrowed the audit down to seven ordered points, including a focus issue no automated tool had flagged.

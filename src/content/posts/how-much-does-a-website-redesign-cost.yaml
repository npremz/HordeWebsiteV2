keyTakeaways_fr:
  - Chez Horde, une refonte professionnelle de site vitrine se situe généralement entre 2 000 € et 8 000 € ; ce repère doit toujours être relié à un périmètre précis.
  - Le contenu, le multilingue, les intégrations et la migration SEO pèsent souvent davantage sur le devis que le nombre de maquettes.
  - Pour comparer deux offres, il faut confronter les livrables, les exclusions, le calendrier, les responsabilités et le suivi après mise en ligne.
keyTakeaways_en:
  - At Horde, a professional service-website redesign generally falls between €2,000 and €8,000; that range only makes sense with a defined scope.
  - Content, multilingual delivery, integrations and SEO migration often affect the quote more than the number of visual mockups.
  - Compare proposals through deliverables, exclusions, timing, responsibilities and post-launch support, not the headline price alone.

keyTakeaways_fr:
  - "Nommez ce qui produit l’impression de qualité : place des réalisations, détails et passage d’un projet à l’autre."
  - Retenez une ambition et des intentions de conception, avec vos propres contenus et votre identité.
  - Une référence visuelle ne prouve ni des résultats commerciaux ni l’adéquation à vos visiteurs ; les choix restent à tester.
keyTakeaways_en:
  - Start with the task, context and behaviour before examining visual treatment.
  - Separate observations, proposed explanations and questions still to be tested.
  - A documented pattern is not automatically appropriate for another audience or task.
  - The useful output is a decision rule with limits, not a screen to reproduce.

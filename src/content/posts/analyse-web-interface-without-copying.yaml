keyTakeaways_fr:
  - "Précisez ce qui vous plaît dans un site : ses images, ses titres ou la façon de trouver une information."
  - Gardez les idées qui servent votre projet, avec vos propres contenus et votre identité.
  - Une référence aide à expliquer une intention ; elle ne remplace pas les choix à faire pour votre public.
keyTakeaways_en:
  - Start with the task, context and behaviour before examining visual treatment.
  - Separate observations, proposed explanations and questions still to be tested.
  - A documented pattern is not automatically appropriate for another audience or task.
  - The useful output is a decision rule with limits, not a screen to reproduce.

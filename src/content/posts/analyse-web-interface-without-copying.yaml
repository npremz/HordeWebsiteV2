title_en: A reference is useful when you understand why it works.
seoTitle_fr: S’inspirer d’un site web sans le copier
seoTitle_en: Analyse a web interface without copying it
excerpt_fr: >-
  Le site de Vucko donne une place singulière aux réalisations et à leur découverte.
  Voyons comment s’en inspirer pour votre projet sans reprendre son identité.
excerpt_en: >-
  A screenshot suggests a look. Analysis helps you decide. Explore three documented
  references and extract useful principles without copying their appearance.
seoDescription_fr: >-
  Comment s’inspirer d’un site web sans le copier ? Avec Vucko, analysez la mise
  en scène des projets et la navigation pour préciser vos attentes de qualité.
seoDescription_en: >-
  Learn to analyse interfaces through tasks, hierarchy, errors and context.
  Three GOV.UK and Primer examples make the method concrete and reusable.

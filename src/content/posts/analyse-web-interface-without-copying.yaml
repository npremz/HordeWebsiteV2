title_fr: Une référence n’est utile que si l’on comprend pourquoi elle fonctionne.
title_en: A reference is useful when you understand why it works.
seoTitle_fr: Analyser une interface web sans la copier
seoTitle_en: Analyse a web interface without copying it
excerpt_fr: >-
  Une capture inspire une apparence. Une analyse aide à décider. Décryptons trois
  références documentées pour en tirer des principes, pas des copies.
excerpt_en: >-
  A screenshot suggests a look. Analysis helps you decide. Explore three documented
  references and extract useful principles without copying their appearance.
seoDescription_fr: >-
  Analysez une interface sans copier son style : tâche, hiérarchie, erreurs et contexte.
  Trois références GOV.UK et Primer, avec une méthode réutilisable.
seoDescription_en: >-
  Learn to analyse interfaces through tasks, hierarchy, errors and context.
  Three GOV.UK and Primer examples make the method concrete and reusable.

keyTakeaways_fr:
  - "Nommez ce qui produit l’impression de qualité : place des réalisations, détails et passage d’un projet à l’autre."
  - Retenez une ambition et des intentions de conception, avec vos propres contenus et votre identité.
  - Une référence visuelle ne prouve ni des résultats commerciaux ni l’adéquation à vos visiteurs ; les choix restent à tester.
keyTakeaways_en:
  - "Name what creates the sense of quality: space for the work, considered details and continuity between projects."
  - Keep the ambition and design intentions, then express them through your own content and identity.
  - A visual reference proves neither business results nor suitability for your visitors; your choices still need testing.

title_fr: Comment s’inspirer d’un site web sans le copier
title_en: How to draw inspiration from a website without copying it
seoTitle_fr: S’inspirer d’un site web sans le copier
seoTitle_en: How to use a website as inspiration without copying it
excerpt_fr: >-
  Le site de Vucko donne une place singulière aux réalisations et à leur découverte.
  Voyons comment s’en inspirer pour votre projet sans reprendre son identité.
excerpt_en: >-
  Vucko’s website gives its work and the act of discovering it a distinctive
  place. Here is how to use it as inspiration for your own project without
  borrowing its identity.
seoDescription_fr: >-
  Comment s’inspirer d’un site web sans le copier ? Avec Vucko, analysez la mise
  en scène des projets et la navigation pour préciser vos attentes de qualité.
seoDescription_en: >-
  How can you use a website as inspiration without copying it? Explore Vucko’s
  project showcase and navigation to define the quality you want.

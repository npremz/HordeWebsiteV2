keyTakeaways_fr:
  - Analysez d’abord la tâche, le contexte et le comportement, puis le traitement visuel.
  - Séparez ce que vous observez, l’explication que vous proposez et ce qui reste à vérifier.
  - Un motif documenté n’est pas automatiquement adapté à un autre public ou à une autre tâche.
  - La bonne sortie d’une analyse est une règle de décision et ses limites, pas une maquette à reproduire.
keyTakeaways_en:
  - Start with the task, context and behaviour before examining visual treatment.
  - Separate observations, proposed explanations and questions still to be tested.
  - A documented pattern is not automatically appropriate for another audience or task.
  - The useful output is a decision rule with limits, not a screen to reproduce.

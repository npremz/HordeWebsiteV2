keyTakeaways_fr:
  - Sur notre test, la sécurité de l’app Lovable tient ; un visiteur anonyme ne peut ni lire ni modifier les données protégées.
  - Lovable invente adresse, horaires et numéro de téléphone, puis les inscrit en base et dans les données lues par Google.
  - Notifications, anti-spam, RGPD et surtout stratégie restent à faire ; Lovable convient au premier jet, pas à un site qui doit grandir.
keyTakeaways_en:
  - In our test, the Lovable app’s security holds; an anonymous visitor can neither read nor change protected data.
  - Lovable invents an address, opening hours and a phone number, then stores them in the database and in the data Google reads.
  - Notifications, anti-spam, GDPR and above all strategy are still to do; Lovable suits a first draft, not a site that has to grow.

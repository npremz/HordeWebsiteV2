slug: art-direction-for-web-interfaces
slug_fr: direction-artistique-interface-web
title_fr: Une interface peut avoir du caractère sans se mettre en travers du chemin.
title_en: Give an interface character and room to work.
seoTitle_fr: 'Direction artistique web : identité et usage'
seoTitle_en: 'Web art direction: identity and usability'
excerpt_fr: >-
  Une direction artistique ne se résume pas à une palette. Voici comment donner
  du caractère à une interface sans compliquer la vie de ses utilisateurs.
excerpt_en: >-
  Art direction is more than a palette. Learn how to give an interface a distinct
  identity while keeping the experience clear and comfortable to use.
seoDescription_fr: >-
  Reliez identité de marque et qualité d’usage : typographie, couleur, composition
  et critères de validation, avec deux variantes à comparer.
seoDescription_en: >-
  Connect brand identity with usability through typography, colour and layout.
  Compare two interactive directions and use a practical review checklist.

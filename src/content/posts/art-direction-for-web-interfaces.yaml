keyTakeaways_fr:
  - La direction artistique traduit une intention de marque en règles de typographie, de couleur, de composition et de mouvement.
  - Les zones d’expression peuvent être singulières ; les informations et les actions doivent rester compréhensibles.
  - Comparer deux variantes avec le même contenu aide à isoler ce que leurs choix visuels changent réellement.
  - Une préférence esthétique ne prouve ni une meilleure conversion ni une expérience accessible.
keyTakeaways_en:
  - Art direction turns brand intent into rules for type, colour, composition and movement.
  - Expressive areas can be distinctive while information and actions remain understandable.
  - Comparing variants with identical content helps isolate what the visual choices actually change.
  - An aesthetic preference does not prove higher conversion or an accessible experience.

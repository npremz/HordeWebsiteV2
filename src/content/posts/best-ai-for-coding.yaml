keyTakeaways_fr:
  - Pour un usage clé en main en équipe, notre choix est Claude Code, sous offre commerciale pour que le code ne serve pas à l’entraînement.
  - La vitesse compte autant que la qualité, parce qu’on travaille par itérations ; un modèle rapide comme DeepSeek est excellent pour tester, à condition de ne pas lui confier de données sensibles.
  - Le code produit par les derniers modèles est suffisant ; l’expérience utilisateur ne l’est pas encore, car l’IA ajoute du bruit qu’un expert UX retire.
keyTakeaways_en:
  - For turnkey team use, our pick is Claude Code, on a commercial plan so the code is not used for training.
  - Speed matters as much as quality because work happens in iterations; a fast model like DeepSeek is excellent for testing, as long as it gets no sensitive data.
  - The code from the latest models is good enough; the user experience is not yet, because AI adds noise that a UX expert removes.

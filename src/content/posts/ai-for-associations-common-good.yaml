keyTakeaways_fr:
  - L’avantage technologique ne devrait pas être réservé aux organisations qui disposent déjà des plus gros budgets.
  - Horde partage une partie des gains de productivité liés à l’IA sous la forme de prix plus accessibles ou de projets plus ambitieux.
  - >-
    L’IA reste un outil : les choix, la compréhension du terrain et la
    responsabilité du résultat restent humains.
keyTakeaways_en:
  - Technological advantage should not be reserved for organizations that already have the largest budgets.
  - Horde shares part of its AI productivity gains through more accessible pricing or more ambitious project scopes.
  - AI remains a tool; decisions, local understanding, and responsibility for the result remain human.

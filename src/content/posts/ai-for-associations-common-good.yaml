title_fr: L’IA au service du commun, pas seulement du capital
title_en: AI for the common good, not only for capital
seoTitle_fr: IA pour les associations et le bien commun
seoTitle_en: AI for nonprofits and the common good
excerpt_fr: >-
  L’IA fait gagner du temps et réduit certains coûts. Chez Horde, nous voulons
  partager cet avantage avec les associations et les projets communautaires.
excerpt_en: >-
  AI saves time and lowers some costs. At Horde, we want to share that advantage
  with nonprofits and community-led projects.
seoDescription_fr: >-
  Comment l’IA peut-elle aider les associations ? Horde partage ses gains de
  productivité pour rendre des projets numériques ambitieux plus accessibles.
seoDescription_en: >-
  How can AI help nonprofits? Horde shares its productivity gains to make
  ambitious digital projects more accessible to community organizations.

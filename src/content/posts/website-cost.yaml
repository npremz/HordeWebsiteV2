keyTakeaways_fr:
  - En 2027, le prix d’un site dépend de ce qu’il doit faire seul (présenter, vendre, tester un produit), pas de son nombre de pages.
  - Un builder ou un générateur IA coûte entre 240 € et 504 € d’abonnement sur deux ans en formule d’entrée, hors taxes, plus votre temps et le coût de sortie.
  - Le prix d’un site généré par IA monte surtout au moment de le reprendre ; chez Horde, la refonte démarre à 999 € HTVA et l’optimisation coûte 199 € HTVA par jour.
keyTakeaways_en:
  - In 2027, a website’s price depends on what it must do on its own (present, sell, test a product), not on its page count.
  - A builder or AI generator costs €240 to €504 in subscriptions over two years on the entry plan, excl. tax, plus your time and the cost of leaving.
  - The price of an AI-generated site rises mostly when it needs reworking; at Horde, a redesign starts at €999 excl. VAT and optimization costs €199 excl. VAT per day.

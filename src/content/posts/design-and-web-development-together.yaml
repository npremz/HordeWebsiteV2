keyTakeaways_fr:
  - Une maquette décrit un état ; une interface doit aussi répondre aux variations de contenu, de largeur et de saisie.
  - Un contrat de composant relie intention, états, contraintes et critères de recette.
  - Les arbitrages de design et de développement gagnent à être discutés avant la validation finale des écrans.
  - Un contrôle local du formulaire ne remplace ni la validation serveur ni une observation des utilisateurs.
keyTakeaways_en:
  - A mockup shows a state; an interface must also handle changes in content, width and input.
  - A component contract connects intent, states, constraints and acceptance checks.
  - Design and development decisions should be discussed before screens receive final approval.
  - Local form checks replace neither server validation nor observation of real users.

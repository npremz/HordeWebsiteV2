title_fr: Une bonne interface ne devrait pas se dégrader entre Figma et le navigateur.
title_en: Good interfaces should survive the move from Figma to the browser.
seoTitle_fr: 'Design et développement web : travailler ensemble'
seoTitle_en: 'Web design and development: working together'
excerpt_fr: >-
  La qualité d’une interface se joue aussi entre la maquette et le code.
  Voici comment partager les décisions et tester les états que l’image ne montre pas.
excerpt_en: >-
  Interface quality also depends on what happens between mockup and code.
  Share the decisions and test the states a polished picture cannot show.
seoDescription_fr: >-
  Faites travailler design et développement autour de comportements vérifiables :
  responsive, clavier, contenu long et erreurs, avec une démo interactive.
seoDescription_en: >-
  Connect web design and development with a shared component contract.
  Try narrow layouts, long labels and error recovery in an interactive example.
featuredImageAlt_fr: Deux cadres d’interface sont reliés par un ruban bleu autour d’un même point d’alignement.
featuredImageAlt_en: Two interface frames are connected by a blue ribbon around a shared alignment point.

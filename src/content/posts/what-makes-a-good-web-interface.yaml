keyTakeaways_fr:
  - Une bonne interface se juge à six questions observables, de la tâche à la responsabilité, pas à l’effet d’une capture d’écran.
  - Les écarts entre « beau » et « bon » apparaissent souvent en comparant ordinateur et mobile, ou en lisant les contenus réels.
  - Une relecture transforme une impression en décisions ; elle ne remplace ni un test avec de vraies personnes, ni un audit d’accessibilité, ni une mesure en production.
keyTakeaways_en:
  - A good interface is judged against six observable questions, from task to ownership, not by the effect of a screenshot.
  - Gaps between “beautiful” and “good” often surface when you compare desktop and mobile, or read the real content.
  - A review turns an impression into decisions; it does not replace testing with real people, an accessibility audit or measurement in production.

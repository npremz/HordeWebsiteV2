title_fr: Une belle interface ne devrait jamais demander un mode d’emploi
title_en: A beautiful interface should never need an instruction manual
seoTitle_fr: Comment reconnaître une bonne interface web ?
seoTitle_en: 'What makes a good web interface? Six questions to ask'
excerpt_fr: >-
  Une bonne interface se juge à ce qu’elle permet de faire, pas à sa capture
  d’écran. Six questions pour l’évaluer, appliquées à une landing en cours.
excerpt_en: >-
  A good interface is judged by what it lets people do, not by its screenshot.
  Six questions to assess one, applied to a landing page in progress.
seoDescription_fr: >-
  Comment reconnaître une bonne interface web ? Six critères observables, de la
  tâche à l’accès mobile, appliqués aux écrans annotés d’une landing en cours.
seoDescription_en: >-
  What makes a good web interface? Six observable criteria, from the task to
  mobile access, applied to annotated screens of a landing page in progress.

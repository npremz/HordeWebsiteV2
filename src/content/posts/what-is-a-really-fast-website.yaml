keyTakeaways_fr:
  - Un bon résultat Core Web Vitals signifie un LCP de 2,5 s ou moins, un INP de 200 ms ou moins et un CLS de 0,1 ou moins au 75e percentile.
  - Les données réelles de CrUX décrivent l'expérience vécue ; Lighthouse sert surtout à diagnostiquer et à reproduire les problèmes.
  - Les images, le JavaScript, les polices, le cache et les services tiers sont les premiers postes à examiner avant une refonte.
keyTakeaways_en:
  - Good Core Web Vitals mean an LCP of 2.5 seconds or less, INP of 200 milliseconds or less and CLS of 0.1 or less at the 75th percentile.
  - CrUX field data describes real user experience, while Lighthouse is primarily a diagnostic and reproduction tool.
  - Images, JavaScript, fonts, caching and third-party services are the first areas to inspect before considering a redesign.

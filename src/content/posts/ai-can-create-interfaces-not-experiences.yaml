keyTakeaways_fr:
  - Une interface comprend des commandes, des informations et des comportements. L’expérience dépend aussi du parcours et du contexte réel d’usage.
  - L’IA rend l’ajout de contenu et de fonctionnalités très facile, alors qu’une bonne UX demande souvent de hiérarchiser et de supprimer.
  - Le jugement humain ne remplace pas les preuves. Il doit s’appuyer sur l’observation, les tests utilisateurs et les données d’usage.
  - L’IA est particulièrement utile pour accélérer l’exploration et les itérations, sans lui déléguer la décision finale.
  - Une revue en six dimensions aide à distinguer les décisions inspectables des hypothèses à tester avec des personnes.
keyTakeaways_en:
  - An interface includes controls, information and behaviour. Experience also depends on the journey and real context of use.
  - AI makes adding content and features easy, while good UX often requires prioritising and removing them.
  - Human judgment is not a substitute for evidence. It must be grounded in observation, user testing and usage data.
  - AI is most useful for accelerating exploration and iteration without being given the final decision.
  - A six-part review separates inspectable decisions from hypotheses that need testing with people.

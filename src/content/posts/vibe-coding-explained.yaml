keyTakeaways_fr:
  - Une app de workshop construite uniquement par prompts, sans ouvrir l’éditeur, a servi deux groupes de vingt personnes chez 42 Belgium.
  - L’IA écrit un code suffisant ; ce qui a fait tenir l’app, ce sont les spécifications, les tests et un test avec de vrais participants.
  - Le risque du vibe coding est l’angle mort UX ; une interface qui a l’air correcte ne l’est pas toujours pour ceux qui s’en servent.
keyTakeaways_en:
  - A workshop app built entirely through prompts, without opening an editor, served two groups of twenty people at 42 Belgium.
  - AI writes good-enough code; what made the app hold up were specifications, tests and a test with real participants.
  - The risk of vibe coding is the UX blind spot; an interface that looks fine is not always fine for the people using it.

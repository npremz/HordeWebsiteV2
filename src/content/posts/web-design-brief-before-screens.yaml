title_fr: Le sur-mesure commence avant la première maquette.
title_en: Custom design starts before the first mockup.
seoTitle_fr: 'Brief de design web : cadrer l’expérience'
seoTitle_en: 'Web design brief: start with the experience'
excerpt_fr: >-
  Avant de demander des pages, précisez l’expérience à créer. Un brief en six
  décisions pour aligner les usages, le design, les contraintes et l’autonomie.
excerpt_en: >-
  Before requesting screens, define the experience you need. A six-decision brief
  connects user tasks, design intent, constraints and long-term independence.
seoDescription_fr: >-
  Préparez un brief de design web en six décisions : public, tâche, identité,
  contraintes, réussite et inconnues. Canevas à remplir et télécharger.
seoDescription_en: >-
  Write a web design brief around six decisions: audience, task, identity,
  constraints, success and unknowns. Fill in and download the practical template.

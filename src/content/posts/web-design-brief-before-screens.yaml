keyTakeaways_fr:
  - Un brief d’expérience décrit d’abord une personne, une situation et une tâche, pas une liste d’écrans.
  - Les intentions visuelles deviennent utiles lorsqu’elles sont reliées à des preuves et à des comportements.
  - L’accessibilité, la maintenance, les contenus et la maîtrise des actifs se cadrent avant la livraison.
  - Les inconnues doivent rester visibles et conduire à une prochaine vérification, pas à de fausses certitudes.
keyTakeaways_en:
  - An experience brief starts with a person, a situation and a task, not a screen list.
  - Visual intentions become useful when connected to evidence and behaviour.
  - Accessibility, maintenance, content and control of digital assets belong in the initial scope.
  - Unknowns should lead to the next check rather than being disguised as certainty.

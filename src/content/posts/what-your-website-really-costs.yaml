keyTakeaways_fr:
  - "Le coût réel d'un site se calcule avec vos données : trafic qualifié, taux de conversion, marge par client, temps interne et dépenses techniques."
  - Une perte estimée doit être présentée comme un scénario, puis vérifiée avec Analytics, Search Console, le CRM et des tests du parcours.
  - Un audit permet de distinguer une optimisation ciblée d'une refonte et de prioriser les corrections selon leur impact et leur effort.
keyTakeaways_en:
  - "A website's real cost should be calculated from your data: qualified traffic, conversion rate, margin per client, staff time and technical spend."
  - Any estimated loss is a scenario to verify with Analytics, Search Console, CRM data and journey testing, not guaranteed recovered revenue.
  - An audit helps distinguish focused optimisation from a redesign and prioritises fixes by likely impact and effort.
